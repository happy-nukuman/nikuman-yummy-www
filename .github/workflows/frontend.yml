name: Frontend CI/CD

on:
  # 手动触发只允许 develop 执行 deploy；其他 ref 仅做验证。
  workflow_dispatch:
  pull_request:
    paths:
      - "FRONTEND/japan-disaster-relief/**"
      - "SHARED/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - develop
    paths:
      - "FRONTEND/japan-disaster-relief/**"
      - "SHARED/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    name: Build (Next.js + OpenNext)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin Node and npm versions
        run: |
          npm install --global npm@11.16.0
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend and shared contract
        run: |
          npm run lint --workspace japan-disaster-relief
          npm run lint --workspace @nikuman-yummy/shared

      - name: Typecheck
        run: |
          npm run typecheck --workspace @nikuman-yummy/shared
          npm run typecheck --workspace japan-disaster-relief

      - name: Test
        run: |
          npm run test --workspace @nikuman-yummy/shared
          npm run test --workspace japan-disaster-relief

      - name: Build worker bundle
        run: npm run build:cloudflare --workspace japan-disaster-relief

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    environment: cloudflare-production
    concurrency:
      group: frontend-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin Node and npm versions
        run: |
          npm install --global npm@11.16.0
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy
        run: npm run deploy --workspace japan-disaster-relief
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_API_MOCK: ${{ vars.NEXT_PUBLIC_API_MOCK }}

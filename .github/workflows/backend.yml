name: Backend CI/CD

on:
  # 手动触发只执行验证；deploy 仅由 develop push 触发。
  workflow_dispatch:
  pull_request:
    paths:
      - "BACKEND/japan-disaster-relief-api/**"
      - "SHARED/**"
      - "DATA/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - develop
    paths:
      - "BACKEND/japan-disaster-relief-api/**"
      - "SHARED/**"
      - "DATA/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/backend.yml"

jobs:
  build:
    name: Build (Hono + Cloudflare Workers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin Node and npm versions
        run: |
          npm install --global npm@11.16.0
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint backend, shared contract, and data scripts
        run: |
          npm run lint --workspace japan-disaster-relief-api
          npm run lint --workspace @nikuman-yummy/shared
          npx eslint DATA/scripts

      - name: Typecheck
        run: |
          npm run typecheck --workspace @nikuman-yummy/shared
          npm run typecheck --workspace japan-disaster-relief-api

      - name: Test
        run: |
          npm run test --workspace @nikuman-yummy/shared
          npm run test --workspace japan-disaster-relief-api

      - name: Validate worker bundle
        run: npm run build --workspace japan-disaster-relief-api

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: cloudflare-production
    concurrency:
      group: backend-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin Node and npm versions
        run: |
          npm install --global npm@11.16.0
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Deploy
        run: npm run deploy --workspace japan-disaster-relief-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
